<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Usage Dashboard</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#c9d1d9;--mut:#8b949e;--acc:#58a6ff;--grn:#3fb950}
*{box-sizing:border-box;margin:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:1000px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;color:#f0f6fc}h2{font-size:20px;color:#f0f6fc;margin:40px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.n{font-size:30px;font-weight:700;color:var(--acc);line-height:1.1}.l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.row{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.bar{background:#21262d;border-radius:4px;height:12px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.v{text-align:right;color:var(--mut)}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--grn);border-radius:8px;padding:14px 16px;color:var(--mut);font-size:14px;margin:16px 0}
svg{width:100%;height:120px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
footer{color:var(--mut);font-size:13px;margin-top:40px}
</style>
</head>
<body><div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
const f=n=>n.toLocaleString();
const bars=(rows,max)=>rows.map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div><span class="v">${f(v)}</span></div>`).join('');
fetch('stats.json').then(r=>r.json()).then(d=>{
  const tools=d.tools,pm=d.projects,tm=Math.max(...tools.map(t=>t[1])),pmx=Math.max(...pm.map(p=>p[1].prompts));
  const dm=Math.max(...d.daily.map(x=>x.prompts)),w=1000/d.daily.length;
  const spark=d.daily.map((x,i)=>`<rect x="${i*w}" y="${120-x.prompts/dm*115}" width="${w-2}" height="${x.prompts/dm*115}" fill="#58a6ff"><title>${x.day}: ${x.prompts} prompts</title></rect>`).join('');
  const hm=Math.max(...d.hours),hw=1000/24;
  const hrs=d.hours.map((v,i)=>`<rect x="${i*hw}" y="${120-v/hm*100}" width="${hw-3}" height="${v/hm*100}" fill="#3fb950"><title>${i}:00 — ${v} prompts</title></rect>`).join('');
  const models=d.models.map(([m,c])=>[m,c]);
  document.getElementById('app').innerHTML=`
  <h1>Claude Code Usage Dashboard</h1>
  <p class="sub">Junaid Tariq · real activity from local Claude Code session logs, ${d.first_day} → ${d.last_day}</p>
  <div class="grid">
   <div class="card"><div class="n">${d.active_days}</div><div class="l">Active days</div></div>
   <div class="card"><div class="n">${d.sessions}</div><div class="l">Sessions</div></div>
   <div class="card"><div class="n">${f(d.prompts)}</div><div class="l">My prompts</div></div>
   <div class="card"><div class="n">${f(d.assistant_turns)}</div><div class="l">Claude turns</div></div>
   <div class="card"><div class="n">${f(d.tool_calls)}</div><div class="l">Tool calls</div></div>
   <div class="card"><div class="n">${d.subagent_runs}</div><div class="l">Subagent runs</div></div>
   <div class="card"><div class="n">${d.pr_links}</div><div class="l">PR links</div></div>
  </div>
  <div class="note">Every number is counted from the session transcripts by <a style="color:var(--acc)" href="https://github.com/Junaid522/claude-multi-agent-portfolio/blob/main/scripts/analyze.py">scripts/analyze.py</a>. Published: counts, project names, branch names and session titles. No prompt or response text. Data was last generated ${d.generated.slice(0,10)}.</div>

  <h2>Daily prompts</h2><svg viewBox="0 0 1000 120" preserveAspectRatio="none">${spark}</svg>
  <h2>Projects</h2>${bars(pm.map(p=>[p[0],p[1].prompts]),pmx)}
  <p class="sub" style="font-size:13px">Bars show prompts per project. Details for each project below.</p>
  ${pm.map(([n,p])=>`<details class="card" style="margin:8px 0"><summary><b>${n}</b> <span class="sub">· ${p.first} → ${p.last} · ${p.active_days} days · ${p.sessions} sessions · ${f(p.prompts)} prompts · ${f(p.tools)} tool calls</span></summary>
    <p class="sub" style="margin-top:8px">Used from: ${p.entrypoints.join(', ')||'n/a'} · Models: ${p.models.join(', ')||'n/a'}</p>
    ${p.branches.length?`<p class="sub">Branches: ${p.branches.join(', ')}</p>`:''}
    <p class="sub">Top tools: ${p.top_tools.map(t=>t[0]+' '+f(t[1])).join(', ')}</p>
    ${p.titles.length?`<p style="margin-top:6px;font-size:14px">Work sessions:</p><ul style="margin-left:20px;font-size:14px;color:var(--mut)">${p.titles.map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('')}</ul>`:''}</details>`).join('')}

  <h2>How I use multiple agents</h2>
  <p class="sub">Multi-agent here means Claude delegating work to subagents that run in their own context window. Honest picture from the logs: ${d.subagent_runs} subagent runs so far, all for read-only investigation, so the main session stays focused on the actual changes.</p>
  <table><tr><th>Subagent</th><th>Project</th><th>Task</th><th>Mode</th></tr>
  ${d.subagents.map(s=>`<tr><td>${s.type}</td><td>${s.project}</td><td>${s.task}</td><td>${s.mode}</td></tr>`).join('')}</table>
  <p class="sub" style="margin-top:12px">Alongside subagents I use <b>background scheduling</b> (ScheduleWakeup ×${(tools.find(t=>t[0]==='ScheduleWakeup')||[0,0])[1]}), <b>Monitor</b> for long-running commands, <b>Skills</b>, and <b>parallel sessions</b> across ${pm.length} projects.</p>

  <h2>Tools Claude used</h2>${bars(tools,tm)}
  <h2>Models</h2>${bars(models,Math.max(...models.map(m=>m[1])))}
  <p class="sub" style="font-size:13px">Bars show assistant turns per model.</p>
  <h2>When I work (local time)</h2><svg viewBox="0 0 1000 120" preserveAspectRatio="none">${hrs}</svg>
  <p class="sub" style="font-size:13px">Hour of day, 0–23, by prompts sent.</p>
  <h2>Where this account is used</h2>
  <p class="sub">${d.platform}. ${d.versions} Claude Code versions seen across ${pm.length} projects, local workspace folders under Documents/projects and Downloads.</p>
  <h2>How sessions run</h2>
  <p class="sub">Permission modes: ${d.permission_modes.map(m=>m[0]+' '+f(m[1])).join(', ')}. Entry points: ${d.entrypoints.map(m=>m[0]+' '+f(m[1])).join(', ')}.</p>
  <footer>Source: local logs under ~/.claude/projects. Earlier history may exist elsewhere that was not available when this was generated.</footer>`;
}).catch(e=>{document.getElementById('app').innerHTML='<p>Could not load stats.json</p>'});
</script></body></html>
